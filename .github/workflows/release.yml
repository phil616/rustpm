name: Release Windows MSI

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (sets the package and MSI version)
        required: true
        default: v0.1.2
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows-msi:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Rust toolchain installation failed" }

      - name: Set release version from tag
        id: version
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must have the form vMAJOR.MINOR.PATCH"
          }
          $version = $env:RELEASE_TAG.Substring(1)
          # Update only the root package in the disposable CI checkout. This
          # also lets an existing tag be released using the repaired workflow.
          $files = @{
            'Cargo.toml' = '(?ms)(^\[package\].*?^version\s*=\s*")[^"]+'
            'Cargo.lock' = '(?m)(^name = "rustpm"\r?\nversion = ")[^"]+'
          }
          foreach ($file in $files.Keys) {
            $content = Get-Content $file -Raw
            $pattern = [regex]::new($files[$file])
            if ($pattern.Matches($content).Count -ne 1) {
              throw "Expected exactly one rustpm version in $file"
            }
            $updated = $pattern.Replace($content, [System.Text.RegularExpressions.MatchEvaluator]{
              param($match)
              $match.Groups[1].Value + $version
            })
            Set-Content $file $updated -NoNewline -Encoding utf8
          }
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Unable to read Cargo metadata" }
          if (($metadata.packages | Where-Object name -eq 'rustpm').version -ne $version) {
            throw "Failed to set package version to $version"
          }
          "msi=dist/rustpm-$version-x64.msi" >> $env:GITHUB_OUTPUT

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX Toolset
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build Windows amd64 MSI
        run: .\scripts\build_msi.ps1 -Target x86_64-pc-windows-msvc

      - name: Publish release MSI
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: ${{ steps.version.outputs.msi }}
          fail_on_unmatched_files: true
          generate_release_notes: true
