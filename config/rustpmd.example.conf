config_dir = /usr/local/etc/rustpm/programs.d
socket = /usr/local/var/run/rustpm/rustpmd.sock
privd_socket = /usr/local/var/run/rustpm/rustpm-privd.sock

[web]
enabled = true
bind = 127.0.0.1
port = 18765
expose = false
# default password is "password" (must be changed in production)
password_hash = argon2id:$argon2id$v=19$m=19456,t=2,p=1$cnVzdHBtLWRlZmF1bHQtc2FsdC12MQ$iRMniVCN0JTsWx0ppqHM6wZfZkJDg7OatRVttR7ZAfI

[dependency]
require_privd = true
startup_timeout_secs = 30
healthcheck_interval_secs = 5
failure_threshold = 3
