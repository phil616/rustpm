# rustpm program config example
#
# Copy this file and remove comments to define a real service.
# Do not keep real production command lines in installer defaults.
#
# [program:example]
# directory = "/Users/alice/My Service"
# command = "/Users/alice/My Service/bin/example" -c "/Users/alice/My Service/config/example.config"
# user = root
# privilege = elevated
# user=root and privilege=elevated are equivalent for elevated mode.
# cross-platform recommendation: prefer privilege = elevated.
# you may keep both for clarity.
# startsecs = 3
# autorestart = true
# redirect_stderr = true
# stdout_logfile_maxbytes = 50MB
# stdout_logfile_backups = 10
# stdout_logfile = /usr/local/var/log/%(program_name)s.log
# stderr_logfile = /usr/local/var/log/%(program_name)s-error.log
#
# Note:
# - If directory or command path contains spaces, wrap that segment in quotes.
