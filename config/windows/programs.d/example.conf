# Example service configuration for rustpm (Windows)
# This is a commented template. No active services are defined by default.
#
# To create a managed service, copy this pattern:
#
# [program:myservice]
# directory = "C:/Program Files/My Service"
# command = "C:/Program Files/My Service/myservice.exe" --config "C:/Program Files/My Service/config.ini"
# user = Administrator
# privilege = elevated
# startsecs = 3
# autorestart = true
# redirect_stderr = true
# stdout_logfile_maxbytes = 50MB
# stdout_logfile_backups = 10
# stdout_logfile = C:\Program Files\rustpm\logs\%(program_name)s.log
# stderr_logfile = C:\Program Files\rustpm\logs\%(program_name)s-error.log
#
# Supported keys:
#   directory            working directory for the service (quote if it contains spaces)
#   command              executable path + args (quote every segment containing spaces)
#   user                 Administrator (elevated) or a local account name
#   privilege            normal or elevated
#   startsecs            seconds to wait before marking "running"
#   autorestart          true/false
#   redirect_stderr      true/false
#   stdout_logfile       path to stdout log file
#   stderr_logfile       path to stderr log file
#   stdout_logfile_maxbytes  max log file size (e.g. 50MB)
#   stdout_logfile_backups   number of rotated log backups
