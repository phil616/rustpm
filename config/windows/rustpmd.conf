# rustpm daemon configuration template (Windows)
# Copy this file to rustpmd.conf and customize for your environment.
#
# Security: This file should be protected with appropriate Windows ACLs.

config_dir = C:\Program Files\rustpm\config\programs.d
socket = \\.\pipe\rustpmd
privd_socket = \\.\pipe\rustpm-privd

[web]
enabled = false
bind = 127.0.0.1
port = 18765
expose = false
# default password is "password" (must be changed in production)
password_hash = argon2id:$argon2id$v=19$m=19456,t=2,p=1$cnVzdHBtLWRlZmF1bHQtc2FsdC12MQ$iRMniVCN0JTsWx0ppqHM6wZfZkJDg7OatRVttR7ZAfI

[dependency]
require_privd = true
startup_timeout_secs = 30
healthcheck_interval_secs = 5
failure_threshold = 3
service_start_delay_secs = 30
service_start_spin_interval_secs = 1
